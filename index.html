<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenho uma pergunta pra você</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #f3f4f6;
            font-family: 'Inter', Arial, sans-serif;
        }

        /* ===== TELA 1: pergunta ===== */
        .painel {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
        }

        h1 {
            color: #374151;
            font-weight: 700;
            font-size: clamp(28px, 5vw, 44px);
            letter-spacing: -0.02em;
            margin: 0 0 36px;
            max-width: 560px;
            line-height: 1.2;
        }

        .botoes {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        button {
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 700;
            font-size: 17px;
            color: white;
            cursor: pointer;
            width: 120px;
            height: 52px;
            box-shadow: 0 2px 6px rgba(0,0,0,.12);
            transition: transform .15s ease, box-shadow .15s ease;
        }
        button:hover { box-shadow: 0 4px 12px rgba(0,0,0,.16); }
        button:active { transform: scale(.96); }

        #sim { background: #10b981; }
        #nao { background: #ef4444; }

        #nao.fugindo {
            position: fixed;
            margin: 0;
            transition: left .3s ease, top .3s ease, transform .15s ease;
        }

        /* ===== TELA 2: festa brega antes do redirect ===== */
        #festa {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #ff00cc, #ffcc00, #00e5ff, #ff00cc);
            background-size: 400% 400%;
            animation: disco .6s linear infinite;
            z-index: 10;
            align-items: center;
            justify-content: center;
        }
        #festa.ativa { display: flex; }
        #festa h1 {
            color: #fff;
            font-size: clamp(40px, 12vw, 110px);
            margin: 0;
            text-shadow: 0 0 20px #fff, 4px 4px 0 #c2185b;
            animation: pisca .4s step-start infinite;
            z-index: 12;
        }
        #fogos {
            position: fixed;
            inset: 0;
            z-index: 11;
            pointer-events: none;
        }
        .balao {
            position: fixed;
            bottom: -80px;
            font-size: 48px;
            animation: sobe linear forwards;
            z-index: 12;
            pointer-events: none;
        }

        @keyframes sobe  { to { transform: translateY(-120vh) rotate(20deg); } }
        @keyframes disco { to { background-position: 400% 0; } }
        @keyframes pisca { 50% { opacity: .3; } }
    </style>
</head>
<body>
    <div class="painel">
        <h1>Oi linda, quer ficar comigo?</h1>
        <div class="botoes">
            <button id="sim">Sim</button>
            <button id="nao">Não</button>
        </div>
    </div>

    <div id="festa">
        <canvas id="fogos"></canvas>
        <h1>🎉🎈 EU SABIA!!! 💖🥳🎊</h1>
    </div>

    <script>
        const sim = document.getElementById("sim");
        const nao = document.getElementById("nao");
        const painel = document.querySelector(".painel");
        const festa = document.getElementById("festa");

        // Música começando em 0:24
        const LINK = "https://www.youtube.com/watch?v=tbJNhH9EVcg&t=24s";
        const TEMPO_FESTA = 4000; // ms antes de redirecionar

        /* ---------- Botão Não que foge ---------- */
        function fuja() {
            const w = nao.offsetWidth;
            const h = nao.offsetHeight;
            const margem = 12;

            if (!nao.classList.contains("fugindo")) {
                const r = nao.getBoundingClientRect();
                nao.style.left = r.left + "px";
                nao.style.top = r.top + "px";
                nao.classList.add("fugindo");
            }

            const maxX = window.innerWidth - w - margem;
            const maxY = window.innerHeight - h - margem;

            const simRect = sim.getBoundingClientRect();
            const atual = nao.getBoundingClientRect();
            let x, y, tentativas = 0;
            do {
                x = margem + Math.random() * (maxX - margem);
                y = margem + Math.random() * (maxY - margem);
                tentativas++;
            } while (
                tentativas < 20 &&
                (Math.hypot(x - simRect.left, y - simRect.top) < 180 ||
                 Math.hypot(x - atual.left, y - atual.top) < 150)
            );

            nao.style.left = x + "px";
            nao.style.top = y + "px";
        }

        nao.addEventListener("mouseenter", fuja);
        nao.addEventListener("touchstart", (e) => {
            e.preventDefault();
            fuja();
        }, { passive: false });
        nao.addEventListener("click", fuja);

        /* ---------- Botão Sim: festa e redirect ---------- */
        sim.addEventListener("click", () => {
            painel.style.display = "none";
            nao.remove();
            festa.classList.add("ativa");
            baloes();
            fogos();
            setTimeout(() => { window.location.href = LINK; }, TEMPO_FESTA);
        });

        function baloes() {
            const emojis = ["🎈", "🎈", "🎈", "🎉", "💖", "🥳"];
            setInterval(() => {
                const b = document.createElement("div");
                b.className = "balao";
                b.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                b.style.left = Math.random() * 95 + "vw";
                b.style.fontSize = (32 + Math.random() * 40) + "px";
                b.style.animationDuration = (2 + Math.random() * 2) + "s";
                document.body.appendChild(b);
                setTimeout(() => b.remove(), 4500);
            }, 80);
        }

        function fogos() {
            const cv = document.getElementById("fogos");
            const ctx = cv.getContext("2d");
            cv.width = window.innerWidth;
            cv.height = window.innerHeight;
            const cores = ["#ff0040", "#ffea00", "#00ff88", "#00c8ff", "#ff00e0", "#ffffff"];
            let particulas = [];

            function explode() {
                const x = Math.random() * cv.width;
                const y = Math.random() * cv.height * 0.6;
                const cor = cores[Math.floor(Math.random() * cores.length)];
                for (let i = 0; i < 80; i++) {
                    const a = Math.random() * Math.PI * 2;
                    const v = 2 + Math.random() * 5;
                    particulas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vida: 60, cor });
                }
            }
            explode();
            setInterval(explode, 250);

            (function loop() {
                ctx.fillStyle = "rgba(0,0,0,.15)";
                ctx.fillRect(0, 0, cv.width, cv.height);
                particulas = particulas.filter(p => p.vida > 0);
                for (const p of particulas) {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.06;
                    p.vida--;
                    ctx.fillStyle = p.cor;
                    ctx.fillRect(p.x, p.y, 3, 3);
                }
                requestAnimationFrame(loop);
            })();
        }
    </script>
</body>
</html>
